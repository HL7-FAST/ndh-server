[project]
name = "npd-data"
version = "0.1.0"
description = "Generate NDH 2.0 conformant seed data subsets from CMS National Provider Directory bulk NDJSON"
requires-python = ">=3.11"
dependencies = [
    "orjson>=3.9",
    "zstandard>=0.22",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["npd_data"]
